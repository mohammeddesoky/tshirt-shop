version: "3.9"

services:
  backend:
    build: ./backend
    container_name: tshirt-shop-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - backend_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/tshirt_shop.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tshirtshop.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@12345}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tshirt-shop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Uncomment to run PostgreSQL instead of SQLite:
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: tshirt-shop-db
  #   environment:
  #     POSTGRES_USER: tshirtshop
  #     POSTGRES_PASSWORD: tshirtshop
  #     POSTGRES_DB: tshirtshop
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  backend_db:
  # postgres_data:
